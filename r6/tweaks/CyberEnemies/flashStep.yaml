
BaseStats.CE_HasFlashStep:
  $type: Stat
  enumName: CE_HasFlashStep
  flags: [ ]
  decimalPlaces: 2
  max: 1
  min: 0

Ability.CE_HasFlashStep:
  $type: GameplayAbility
  loc_key_name: "LocKey#cyberEnemies_abilityName_flashStep"
  loc_key_desc: "LocKey#cyberEnemies_abilityDescription_flashStep"
  showInCodex: true
  abilityPackage:
    $type: GameplayLogicPackage
    stats:
      - $type: ConstantStatModifier
        modifierType: Additive
        statType: BaseStats.CE_HasFlashStep
        value: 1    

CE_HasFlashStepAbilityGroup:
  $type: GameplayAbilityGroup
  abilities: 
    - Ability.CE_HasFlashStep

UIIcon.Ability.CE_HasFlashStep:
  $type: UIIcon
  atlasPartName: ICONS_CanDash
  atlasResourcePath: base\gameplay\gui\common\icons\abilities_tooltips_icons.inkatlas

BaseStatusEffect.CE_FlashStepCDDurationStat:
  $type: ConstantStatModifier
  modifierType: Additive
  statType: BaseStats.MaxDuration
  value: 15

BaseStatusEffect.CE_FlashStepCD:
  $type: StatusEffect
  gameplayTags: ["Debuff"]
  duration: 
    $type: StatModifierGroup
    statModsLimit: -1
    statModifiers: 
      - BaseStatusEffect.CE_FlashStepCDDurationStat
  isAffectedByTimeDilationNPC: true
  isAffectedByTimeDilationPlayer: true
  maxStacks: 
    $type: StatModifierGroup
    statModsLimit: -1
    statModifiers: 
      - $type: ConstantStatModifier
        modifierType: Additive
        statType: BaseStats.MaxStacks
        value: 1
  savable: true
  statusEffectType: BaseStatusEffectTypes.Misc
  stopActiveSfxOnDeactivate: true

