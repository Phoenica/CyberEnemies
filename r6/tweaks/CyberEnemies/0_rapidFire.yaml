Ability.CE_RapidFire:
  $type: GameplayAbility
  loc_key_name: "LocKey#cyberEnemies_abilityName_rapidFire"
  loc_key_desc: "LocKey#cyberEnemies_abilityDescription_rapidFire"
  showInCodex: true
  abilityPackage:
    $type: GameplayLogicPackage
    stats:
      - $type: ConstantStatModifier
        modifierType: Additive
        statType: BaseStats.IMSABonusAccuracy
        value: -0.25

UIIcon.Ability.CE_RapidFire:
  $type: UIIcon
  atlasPartName: ICONS_CanOverheatQuickHack
  atlasResourcePath: base\gameplay\gui\common\icons\abilities_tooltips_icons.inkatlas

CE_RapidFireAbilityGroup:
  $type: GameplayAbilityGroup
  abilities: 
    - Ability.CE_RapidFire


Items.Preset_Overture_RapidFire:
  $base: Items.Preset_Overture_Default
  npcRPGData:   
    $base: Items.Base_Overture_inline10
    statModifierGroups:
      - Items.NPCQualityRandomization
      - Items.Base_Revolver_NPC_Stats
      - Items.Base_Overture_NPC_Damage_Stats
      - $base: Items.Base_Overture_Technical_Stats
        statModifiers:
          - Items.Base_Overture_Technical_Stats_inline0
          - $type: ConstantStatModifier
            modifierType: Additive
            statType: BaseStats.CycleTimeBase
            value: 0.15
          - Items.Base_Overture_Technical_Stats_inline2
          - Items.Base_Overture_Technical_Stats_inline3
          - BaseStats.ProjectilesPerShotCombinedModifier

Items.CE_RapidFireOvertureGroup:
  $type: NPCEquipmentGroup
  equipmentItems:
    - $type: NPCEquipmentItemPool
      pool: 
        - $type: NPCEquipmentItemsPoolEntry
          minLevel: 0
          weight: 1.0
          items: 
            - $type: NPCEquipmentItem
              equipSlot: AttachmentSlots.WeaponRight
              item: Items.Preset_Overture_RapidFire

