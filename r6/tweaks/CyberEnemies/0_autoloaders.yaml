Ability.CE_AutoLoader:
  $type: GameplayAbility
  loc_key_name: "LocKey#cyberEnemies_abilityName_autoLoader"
  loc_key_desc: "LocKey#cyberEnemies_abilityDescription_autoLoader"
  showInCodex: true

UIIcon.Ability.CE_AutoLoader:
  $type: UIIcon
  atlasPartName: ICONS_HasAutoReloader
  atlasResourcePath: base\gameplay\gui\common\icons\abilities_tooltips_icons.inkatlas

CE_AutoLoaderAbilityGroup:
  $type: GameplayAbilityGroup
  abilities: 
    - Ability.CE_AutoLoader

Items.Preset_Guillotine_Military_AutoLoader:
  $base: Items.Preset_Guillotine_Military
  npcRPGData:
    $base: Items.Base_Guillotine_inline9
    statModifierGroups:
      - Items.NPCQualityRandomization
      - Items.Base_Submachinegun_NPC_Stats
      - Items.Base_Guillotine_NPC_Damage_Stats
      - $base: Items.Base_Guillotine_Technical_Stats
        statModifiers:
          - Items.Base_Guillotine_Technical_Stats_inline0
          - Items.Base_Guillotine_Technical_Stats_inline1
          - $type: ConstantStatModifier
            modifierType: Additive
            statType: BaseStats.MagazineCapacityBase
            value: 9999
          - Items.Base_Guillotine_Technical_Stats_inline3
          - BaseStats.ProjectilesPerShotCombinedModifier

Items.CE_AutoLoaderGuillotineGroup:
  $type: NPCEquipmentGroup
  equipmentItems:
    - $type: NPCEquipmentItemPool
      pool: 
        - $type: NPCEquipmentItemsPoolEntry
          minLevel: 0
          weight: 1.0
          items: 
            - $type: NPCEquipmentItem
              equipCondition: 
                - WeaponConditions.BaseRangedPrimaryWeaponEquipCondition
              unequipCondition:
                - WeaponConditions.BaseRangedPrimaryWeaponUnequipCondition
              equipSlot: AttachmentSlots.WeaponRight
              item: Items.Preset_Guillotine_Military_AutoLoader

