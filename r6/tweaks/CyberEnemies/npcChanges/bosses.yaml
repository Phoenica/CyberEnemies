BaseStatusEffect.PernamentCyberwareDisable:
  $type: StatusEffect
  gameplayTags: ["Debuff", "CyberwareMalfunction"]
  duration: BaseStats.InfiniteDuration
  isAffectedByTimeDilationNPC: true
  isAffectedByTimeDilationPlayer: true
  packages:
    - $type: GameplayLogicPackage
      stackable: true
      stats:
        - $type: ConstantStatModifier
          modifierType: Multiplier
          statType: BaseStats.HasSandevistan
          value: 0    
        - $type: ConstantStatModifier
          modifierType: Multiplier
          statType: BaseStats.HasKerenzikov
          value: 0  
  maxStacks: 
    $type: StatModifierGroup
    statModsLimit: -1
    statModifiers: 
      - $type: ConstantStatModifier
        modifierType: Additive
        statType: BaseStats.MaxStacks
        value: 1
  savable: true
  statusEffectType: BaseStatusEffectTypes.Misc
  stopActiveSfxOnDeactivate: true

