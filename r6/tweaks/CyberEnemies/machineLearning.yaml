Ability.CEMachineLearning:
  $type: GameplayAbility
  loc_key_name: "LocKey#cyberEnemies_abilityName_ml"
  loc_key_desc: "LocKey#cyberEnemies_abilityDescription_ml"
  showInCodex: true
  abilityPackage:
    $type: GameplayLogicPackage
    stats:
        - $type: ConstantStatModifier
          modifierType: Additive
          statType: BaseStats.CE_HasMachineLearning
          value: 1


UIIcon.Ability.CEMachineLearning:
  $type: UIIcon
  atlasPartName: ICONS_CanResurrectAllies
  atlasResourcePath: phoenicia\cyberenemies\icons\abilities.inkatlas

CEMachineLearningAbilityGroup:
  $type: GameplayAbilityGroup
  abilities: 
    - Ability.CEMachineLearning

BaseStats.CE_HasMachineLearning:
  $type: Stat
  enumName: CE_HasMachineLearning
  flags: [ ]
  decimalPlaces: 1
  max: 1
  min: 0

BaseStatusEffect.CEMachineLearningACC:
  $type: StatusEffect
  gameplayTags: ["Buff"]
  duration: BaseStats.InfiniteDuration
  isAffectedByTimeDilationNPC: true
  isAffectedByTimeDilationPlayer: true
  maxStacks: 
    $type: StatModifierGroup
    statModsLimit: -1
    statModifiers: 
      - $type: ConstantStatModifier
        modifierType: Additive
        statType: BaseStats.MaxStacks
        value: 10
  savable: true
  statusEffectType: BaseStatusEffectTypes.Misc
  stopActiveSfxOnDeactivate: true
  packages: 
    - $type: GameplayLogicPackage
      stackable: true
      stats:
        - $type: ConstantStatModifier
          modifierType: Additive
          statType: BaseStats.IMSABonusAccuracy
          value: 0.1

BaseStatusEffect.CEMachineLearningKerenzikov:
  $type: StatusEffect
  gameplayTags: ["Buff"]
  duration: BaseStats.InfiniteDuration
  isAffectedByTimeDilationNPC: true
  isAffectedByTimeDilationPlayer: true
  maxStacks: 
    $type: StatModifierGroup
    statModsLimit: -1
    statModifiers: 
      - $type: ConstantStatModifier
        modifierType: Additive
        statType: BaseStats.MaxStacks
        value: 1
  savable: true
  statusEffectType: BaseStatusEffectTypes.Misc
  stopActiveSfxOnDeactivate: true
  packages: 
    - $type: GameplayLogicPackage
      effectors:
        - $type: Effector 
          effectorClassName: CyberEnemies.PowerPunch.PowerPunchKurtEffector
          prereqRecord:
            $type: HitPrereq
            callbackType: HitTriggered
            ignoreSelfInflictedPressureWave: true
            isSynchronous: true
            pipelineStage: PostProcess
            pipelineType: Damage
            prereqClassName: HitTriggeredPrereq
            conditions:
              - $type: HitPrereqCondition
                type: Prereqs.WeaponType
                weaponType: Melee   
      stackable: false
      stats:
        - $type: ConstantStatModifier
          modifierType: Additive
          statType: BaseStats.HasKerenzikov
          value: 1
        - $type: ConstantStatModifier
          modifierType: Additive
          statType: BaseStats.HasDodge
          value: 1

