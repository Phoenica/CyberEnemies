BaseStats.CE_PlayerECM:
  $type: Stat
  enumName: CE_PlayerECM
  flags: [ ]
  decimalPlaces: 1
  max: 5
  min: 0

CE_Cyberware.ECM$(tier):
  $instances:
    - { tier: Uncommon, nextTier: CE_Cyberware.ECMUncommonPlus }
    - { tier: UncommonPlus, nextTier: CE_Cyberware.ECMRare }
    - { tier: Rare, nextTier: CE_Cyberware.ECMRarePlus }
    - { tier: RarePlus, nextTier: CE_Cyberware.ECMEpic }
    - { tier: Epic, nextTier: CE_Cyberware.ECMEpicPlus }
    - { tier: EpicPlus, nextTier: CE_Cyberware.ECMLegendary }
    - { tier: Legendary, nextTier: CE_Cyberware.ECMLegendaryPlus }
    - { tier: LegendaryPlus, nextTier: CE_Cyberware.ECMLegendaryPlusPlus }
    - { tier: LegendaryPlusPlus, nextTier: None }
  $base: Items.AdvancedBoringPlating$(tier)
  buyPrice:
    - Price.BaseCyberwarePrice
    - Price.ItemQualityMultiplier
    - Price.PlusTierMultiplier
    - Price.CyberwareMultiplier
    - Price.BuyPrice_StreetCred_Discount
    - Items.AdvancedElectroshockMechanismCommon_inline9
  sellPrice:
    - Price.BaseCyberwarePrice
    - Price.ItemQualityMultiplier
    - Price.PlusTierMultiplier
    - Price.CyberwareMultiplier
    - Price.CyberwareSellMultiplier
    - Items.AdvancedElectroshockMechanismCommon_inline10
  icon:
    $type: UIIcon
    atlasPartName: cw_integumentary_personalsoundsilencer
    atlasResourcePath: base\gameplay\gui\common\icons\items\item_icons5.inkatlas
  displayName: LocKey#cyberEnemies_cyberware_ecm_name
  localizedDescription: LocKey#cyberEnemies_cyberware_ecm_flavor
  variants: [Variants.Humanity25CostTinkererVariant]
  cyberwareType: ECM
  nextUpgradeItem: $(nextTier)
  OnEquip: 
    - $type: GameplayLogicPackage
      UIData: 
        $type: GameplayLogicPackageUIData
        localizedDescription: LocKey#cyberEnemies_cyberware_ecm_description1
      stats: 
        - $type: ConstantStatModifier
          modifierType: Additive
          statType: BaseStats.CE_PlayerECM
          value: 1


CE_Cyberware.ECM$(tier):
  $instances:
    - { tier: Rare }
    - { tier: RarePlus }
