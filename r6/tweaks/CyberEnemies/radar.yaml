BaseStatusEffect.CEAWACSDebuff:
  $type: StatusEffect
  gameplayTags: ["Debuff"]
  duration: 
    $type: StatModifierGroup
    statModsLimit: -1
    statModifiers: 
      - $type: ConstantStatModifier
        modifierType: Additive
        statType: BaseStats.MaxDuration
        value: 5
  isAffectedByTimeDilationNPC: true
  isAffectedByTimeDilationPlayer: true
  maxStacks: 
    $type: StatModifierGroup
    statModsLimit: -1
    statModifiers: 
      - $type: ConstantStatModifier
        modifierType: Additive
        statType: BaseStats.MaxStacks
        value: 1
  savable: true
  packages:
    - $type: GameplayLogicPackage
      stats:  
        - $type: ConstantStatModifier
          modifierType: Multiplier
          statType: BaseStats.SmartTargetingDisruptionProbability
          value: 0.0

BaseStatusEffect.CEAWACSTag:
  $type: StatusEffect
