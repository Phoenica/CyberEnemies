
BaseStats.CE_HasRadar:
  $type: Stat
  enumName: CE_HasRadar
  flags: [ ]
  decimalPlaces: 2
  max: 1
  min: 0

Ability.CE_HasRadar:
  $type: GameplayAbility
  loc_key_name: "LocKey#cyberEnemies_abilityName_radar"
  loc_key_desc: "LocKey#cyberEnemies_abilityDescription_radar"
  showInCodex: true
  abilityPackage:
    $type: GameplayLogicPackage
    stats:
      - $type: ConstantStatModifier
        modifierType: Additive
        statType: BaseStats.CE_HasRadar
        value: 1    
      - $type: ConstantStatModifier
        modifierType: Additive
        statType: BaseStats.ElectricResistance
        value: -25

CE_RadarAbilityGroup:
  $type: GameplayAbilityGroup
  abilities: 
    - Ability.CE_HasRadar

UIIcon.Ability.CE_HasRadar:
  $type: UIIcon
  atlasPartName: ICONS_Radar
  atlasResourcePath: phoenicia\cyberenemies\icons\abilities.inkatlas


