Ability.CEScanShield:
  $type: GameplayAbility
  loc_key_name: "LocKey#cyberEnemies_abilityName_scanShield"
  loc_key_desc: "LocKey#cyberEnemies_abilityDescription_scanShield"
  showInCodex: true

Ability.CEScanShieldHologram:
  $type: GameplayAbility
  showInCodex: false

UIIcon.Ability.CEScanShield:
  $type: UIIcon
  atlasPartName: ICONS_ScanShield
  atlasResourcePath: phoenicia\cyberenemies\icons\abilities.inkatlas

CEScanShieldAbilityGroup:
  $type: GameplayAbilityGroup
  abilities: 
    - Ability.CEScanShield

Ability.CEScavScanShield:
  $type: GameplayAbility
  loc_key_name: "LocKey#cyberEnemies_abilityName_scanShieldScav"
  loc_key_desc: "LocKey#cyberEnemies_abilityDescription_scanShieldScav"
  showInCodex: true

UIIcon.Ability.CEScavScanShield:
  $type: UIIcon
  atlasPartName: face_morph
  atlasResourcePath: base\gameplay\gui\common\icons\mappin_icons.inkatlas

CEScavScanShieldAbilityGroup:
  $type: GameplayAbilityGroup
  abilities: 
    - Ability.CEScavScanShield

BaseStats.CE_HasGoodKiroshi:
  $type: Stat
  enumName: CE_HasGoodKiroshi
  flags: [ ]
  decimalPlaces: 1
  max: 1
