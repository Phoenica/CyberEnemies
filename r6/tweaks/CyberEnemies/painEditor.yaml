Ability.CE_PainEditor:
  $type: GameplayAbility
  loc_key_name: "LocKey#cyberEnemies_abilityName_painEditor"
  loc_key_desc: "LocKey#cyberEnemies_abilityDescription_painEditor"
  showInCodex: true
  abilityPackage:
    $type: GameplayLogicPackage
    stats:
        - $type: ConstantStatModifier
          modifierType: Additive
          statType: BaseStats.CE_HasPainEditor
          value: 1
        - $type: ConstantStatModifier
          modifierType: Multiplier
          statType: BaseStats.ImpactDamageThreshold
          value: 0
        - $type: ConstantStatModifier
          modifierType: Multiplier
          statType: BaseStats.StaggerDamageThreshold
          value: 0



UIIcon.Ability.CE_PainEditor:
  $type: UIIcon
  atlasPartName: ICONS_HasBoostedCortex
  atlasResourcePath: base\gameplay\gui\common\icons\abilities_tooltips_icons.inkatlas

CE_PainEditorAbilityGroup:
  $type: GameplayAbilityGroup
  abilities: 
    - Ability.CE_PainEditor


BaseStats.CE_HasPainEditor:
  $type: Stat
  enumName: CE_HasPainEditor
  flags: [ ]
  decimalPlaces: 1
  max: 1
  min: 0

BaseStatusEffect.CE_PainEditorCooldownDurationStat:
  $type: ConstantStatModifier
  modifierType: Additive
  statType: BaseStats.MaxDuration
  value: 55

BaseStatusEffect.CE_PainEditorCooldown:
